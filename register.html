<!-- register.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Admin - SemestaBuku</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">🌿 SemestaBuku</a>
        <div class="nav-links"><a href="login.html">Login Admin</a></div>
    </nav>
    <div class="container">
        <div class="form-container">
            <h2 class="section-title" style="text-align: center;">Registrasi Admin</h2>
            <p id="regMsg" style="text-align: center; margin-bottom: 15px;"></p>
            <form id="regForm">
                <div class="form-group">
                    <label>Username Baru</label>
                    <input type="text" id="regUser" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPass" required>
                </div>
                <button type="submit" class="btn-pill" style="width: 100%; text-align: center;">Daftar Akun</button>
            </form>
        </div>
    </div>
    <footer><p>&copy; 2026 SemestaBuku.</p></footer>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('regUser').value;
            const p = document.getElementById('regPass').value;
            registerAdmin(u, p);
            document.getElementById('regMsg.style.color = "green"';
            document.getElementById('regMsg').innerText = "Registrasi berhasil! Silakan login.";
            setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        });
    </script>
</body>
</html>
