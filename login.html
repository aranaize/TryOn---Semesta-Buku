<!-- login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SemestaBuku</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">🌿 SemestaBuku</a>
        <div class="nav-links"><a href="index.html">Kembali ke Beranda</a></div>
    </nav>
    <div class="container">
        <div class="form-container">
            <h2 class="section-title" style="text-align: center;">Login Admin</h2>
            <p id="loginError" style="color: red; text-align: center; margin-bottom: 15px;"></p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUser" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" required placeholder="admin123">
                </div>
                <button type="submit" class="btn-pill" style="width: 100%; text-align: center;">Masuk Dashboard</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="register.html" style="color: var(--primary-green); text-decoration: none; font-size: 14px;">Belum punya akun? Registrasi</a>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 SemestaBuku.</p></footer>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(checkLogin(u, p)) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('loginError').innerText = "Username atau Password salah! (Coba admin / admin123)";
            }
        });
    </script>
</body>
</html>
