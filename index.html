<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemestaBuku - Beranda</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">🌿 SemestaBuku</a>
        <div class="nav-links">

            <a href="peminjaman.html">Form Peminjaman</a>
            <a href="admin.html" class="btn-pill" id="adminNavBtn">Dashboard Admin</a>
        </div>
    </nav>

    <div class="hero-section">
        <h1>Jelajahi Dunia Lewat Setiap Halaman Buku</h1>
        <p>Temukan koleksi buku inspiratif dengan sistem peminjaman yang mudah, cepat, dan ramah lingkungan.</p>

    <footer>
        <p>&copy; 2026 SemestaBuku. All Rights Reserved. Designed with Nature UI/UX.</p>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCatalog();
        });
    </script>
